<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Préstamos · BookSmart</title>
    <meta
      name="description"
      content="BookSmart, sistema web de gestión de biblioteca."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=diseno" />
  </head>
  <body>
    <main class="contenedor" id="principal">
      <div class="encabezado">
        <div>
          <h1>Préstamos</h1>
          <p class="suave" id="resumen"></p>
        </div>
        <label
          >Filtrar por estado
          <select id="filtro">
            <option value="">Todos</option>
            <option value="pendiente">Pendientes</option>
            <option value="prestado">Prestados</option>
            <option value="vencido">Vencidos</option>
            <option value="devuelto">Devueltos</option>
            <option value="rechazado">Rechazados</option>
            <option value="cancelado">Cancelados</option>
          </select>
        </label>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Libro</th>
              <th>Lector</th>
              <th>Estado</th>
              <th>Fechas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
      <nav
        class="paginacion"
        id="paginacion"
        aria-label="Paginación"
        hidden
      ></nav>
    </main>
    <script src="/js/api.js?v=diseno"></script>
    <script src="/js/admin-loans.js?v=diseno"></script>
  </body>
</html>
