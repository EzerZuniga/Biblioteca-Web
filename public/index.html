<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca</title>
</head>
<body>
  <script>
    // Redirige según la sesión: sin sesión -> login; con sesión -> su página de inicio
    const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (!localStorage.getItem('token') || !usuario) location.replace('/login.html');
    else location.replace(usuario.rol === 'admin' ? '/admin-prestamos.html' : '/catalogo.html');
  </script>
</body>
</html>
