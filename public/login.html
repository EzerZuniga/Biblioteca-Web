<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · BookSmart</title>
    <meta
      name="description"
      content="Inicia sesión en BookSmart para pedir libros de la biblioteca."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=menu-lateral" />
  </head>
  <body>
    <main class="auth" id="principal">
      <section class="auth-form">
        <form id="formLogin" novalidate>
          <a class="auth-logo" href="/"
            ><img
              src="/images/logo.webp"
              alt="BookSmart"
              width="510"
              height="128"
          /></a>
          <h1>Inicia sesión</h1>
          <p id="aviso" class="aviso" role="status" hidden></p>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Email
            <input type="email" id="email" autocomplete="username" required />
          </label>
          <label
            >Contraseña
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="btn" type="submit" id="btnEntrar">
            Iniciar sesión
          </button>
          <p class="suave">
            <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
          </p>
          <p class="suave">
            ¿No tienes cuenta? <a href="/register.html">Crea una</a>
          </p>
        </form>
      </section>
      <section class="auth-lado">
        <h2>Encuentra tu libro y pídelo desde aquí.</h2>
        <p>
          Busca en el catálogo, solicita el préstamo y recógelo cuando un
          administrador lo apruebe.
        </p>
        <p>Cada préstamo recibe un código como este:</p>
        <span class="codigo">A7F3C91D</span>
      </section>
    </main>
    <script src="/js/api.js?v=menu-lateral"></script>
    <script src="/js/login.js?v=menu-lateral"></script>
  </body>
</html>
