<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo - Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css?v=api-v1" />
  </head>
  <body>
    <main class="contenedor">
      <div class="encabezado">
        <div>
          <h1>Catálogo de libros</h1>
          <p class="suave">
            Solicita un libro y espera la aprobación del administrador.
          </p>
        </div>
        <label class="buscador"
          >Buscar por título
          <input
            type="search"
            id="buscar"
            placeholder="Ej. Clean Code"
            autocomplete="off"
          />
        </label>
      </div>
      <div class="grid-libros" id="grid" aria-live="polite"></div>
      <nav
        class="paginacion"
        id="paginacion"
        aria-label="Paginación"
        hidden
      ></nav>
    </main>
    <script src="/js/api.js?v=api-v1"></script>
    <script src="/js/catalog.js?v=api-v1"></script>
  </body>
</html>
