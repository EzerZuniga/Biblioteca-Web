<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo · BookSmart</title>
    <meta
      name="description"
      content="BookSmart, sistema web de gestión de biblioteca."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=menu-lateral" />
  </head>
  <body>
    <main class="contenedor" id="principal">
      <div class="encabezado">
        <div>
          <h1>Catálogo de libros</h1>
          <p class="suave">
            Solicita un libro y espera la aprobación del administrador.
          </p>
        </div>
        <label class="buscador"
          >Buscar por título, autor o ISBN
          <input
            type="search"
            id="buscar"
            placeholder="Ej. Clean Code o García Márquez"
            autocomplete="off"
          />
        </label>
      </div>
      <div class="grid-libros" id="grid" aria-live="polite"></div>
      <nav
        class="paginacion"
        id="paginacion"
        aria-label="Paginación"
        hidden
      ></nav>
    </main>
    <script src="/js/api.js?v=menu-lateral"></script>
    <script src="/js/catalog.js?v=menu-lateral"></script>
  </body>
</html>
