<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta · BookSmart</title>
    <meta
      name="description"
      content="Crea tu cuenta en BookSmart para pedir libros de la biblioteca."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=menu-lateral" />
  </head>
  <body>
    <main class="auth" id="principal">
      <section class="auth-form">
        <form id="formRegistro" novalidate>
          <a class="auth-logo" href="/"
            ><img
              src="/images/logo.webp"
              alt="BookSmart"
              width="510"
              height="128"
          /></a>
          <h1>Crear cuenta</h1>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Nombre completo
            <input
              type="text"
              id="nombre"
              autocomplete="name"
              maxlength="100"
              required
            />
          </label>
          <label
            >Email
            <input type="email" id="email" autocomplete="username" required />
          </label>
          <label
            >Contraseña (mínimo 6 caracteres)
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </label>
          <label
            >Repite la contraseña
            <input
              type="password"
              id="password2"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="btn" type="submit" id="btnCrear">Crear cuenta</button>
          <p class="suave">
            ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
          </p>
        </form>
      </section>
      <section class="auth-lado">
        <h2>Crea tu cuenta para pedir libros.</h2>
        <p>
          Solo necesitas tu nombre, un email y una contraseña. Tu cuenta nueva
          es de tipo usuario.
        </p>
      </section>
    </main>
    <script src="/js/api.js?v=menu-lateral"></script>
    <script src="/js/register.js?v=menu-lateral"></script>
  </body>
</html>
