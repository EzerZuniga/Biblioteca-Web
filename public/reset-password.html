<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- El enlace trae un token secreto: nunca se envía a otros sitios. -->
    <meta name="referrer" content="no-referrer" />
    <title>Nueva contraseña - Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css?v=recuperacion" />
  </head>
  <body>
    <main class="auth">
      <section class="auth-lado">
        <h1>Elige una contraseña nueva.</h1>
        <p>
          Al guardarla se cerrarán las sesiones abiertas en otros dispositivos.
        </p>
      </section>
      <section class="auth-form">
        <form id="formRestablecer" novalidate>
          <h2>Nueva contraseña</h2>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Contraseña nueva
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </label>
          <label
            >Repite la contraseña
            <input
              type="password"
              id="password2"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="btn" type="submit" id="btnGuardar">
            Guardar contraseña
          </button>
          <p class="suave">
            ¿El enlace venció?
            <a href="/forgot-password.html">Pide uno nuevo</a>
          </p>
        </form>
      </section>
    </main>
    <script src="/js/api.js?v=recuperacion"></script>
    <script src="/js/reset-password.js?v=recuperacion"></script>
  </body>
</html>
