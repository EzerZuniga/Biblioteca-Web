<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- El enlace trae un token secreto: nunca se envía a otros sitios. -->
    <meta name="referrer" content="no-referrer" />
    <title>Nueva contraseña · BookSmart</title>
    <meta
      name="description"
      content="Elige una contraseña nueva para tu cuenta de BookSmart."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=diseno" />
  </head>
  <body>
    <main class="auth" id="principal">
      <section class="auth-form">
        <form id="formRestablecer" novalidate>
          <a class="auth-logo" href="/"
            ><img
              src="/images/logo.webp"
              alt="BookSmart"
              width="510"
              height="128"
          /></a>
          <h1>Nueva contraseña</h1>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Contraseña nueva
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </label>
          <label
            >Repite la contraseña
            <input
              type="password"
              id="password2"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="btn" type="submit" id="btnGuardar">
            Guardar contraseña
          </button>
          <p class="suave">
            ¿El enlace venció?
            <a href="/forgot-password.html">Pide uno nuevo</a>
          </p>
        </form>
      </section>
      <section class="auth-lado">
        <h2>Elige una contraseña nueva.</h2>
        <p>
          Al guardarla se cerrarán las sesiones abiertas en otros dispositivos.
        </p>
      </section>
    </main>
    <script src="/js/api.js?v=diseno"></script>
    <script src="/js/reset-password.js?v=diseno"></script>
  </body>
</html>
