<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña · BookSmart</title>
    <meta
      name="description"
      content="Recupera el acceso a tu cuenta de BookSmart."
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css?v=menu-lateral" />
  </head>
  <body>
    <main class="auth" id="principal">
      <section class="auth-form">
        <form id="formRecuperar" novalidate>
          <a class="auth-logo" href="/"
            ><img
              src="/images/logo.webp"
              alt="BookSmart"
              width="510"
              height="128"
          /></a>
          <h1>Recuperar contraseña</h1>
          <p id="aviso" class="aviso" role="status" hidden></p>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Email
            <input type="email" id="email" autocomplete="email" required />
          </label>
          <button class="btn" type="submit" id="btnEnviar">
            Enviar enlace
          </button>
          <p class="suave">
            ¿La recordaste? <a href="/login.html">Inicia sesión</a>
          </p>
        </form>
      </section>
      <section class="auth-lado">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>
          Escribe el email de tu cuenta y te enviaremos un enlace para elegir
          una nueva. El enlace vence en una hora y sirve una sola vez.
        </p>
      </section>
    </main>
    <script src="/js/api.js?v=menu-lateral"></script>
    <script src="/js/forgot-password.js?v=menu-lateral"></script>
  </body>
</html>
