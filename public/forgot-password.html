<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña - Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css?v=recuperacion" />
  </head>
  <body>
    <main class="auth">
      <section class="auth-lado">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>
          Escribe el email de tu cuenta y te enviaremos un enlace para elegir
          una nueva. El enlace vence en una hora y sirve una sola vez.
        </p>
      </section>
      <section class="auth-form">
        <form id="formRecuperar" novalidate>
          <h2>Recuperar contraseña</h2>
          <p id="aviso" class="aviso" role="status" hidden></p>
          <p id="error" class="error" role="alert" hidden></p>
          <label
            >Email
            <input type="email" id="email" autocomplete="email" required />
          </label>
          <button class="btn" type="submit" id="btnEnviar">
            Enviar enlace
          </button>
          <p class="suave">
            ¿La recordaste? <a href="/login.html">Inicia sesión</a>
          </p>
        </form>
      </section>
    </main>
    <script src="/js/api.js?v=recuperacion"></script>
    <script src="/js/forgot-password.js?v=recuperacion"></script>
  </body>
</html>
